name: Build & Release APK and AAB

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and AAB & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=v1.0.1-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-fatal)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Setup App Signing (Generate & Store automatically)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore found in secrets. Generating a new one..."
            KEY_ALIAS="upload"
            STORE_PASSWORD=$(openssl rand -base64 16 | tr -dc 'a-zA-Z0-9' | head -c 16)
            KEY_PASSWORD=$STORE_PASSWORD
            
            keytool -genkey -v -keystore android/app/release.keystore -alias $KEY_ALIAS -keypass $KEY_PASSWORD -storepass $STORE_PASSWORD -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Swavoti, OU=App, O=Swavoti, L=Unknown, ST=Unknown, C=ZA"
            
            KEYSTORE_BASE64=$(base64 -w 0 android/app/release.keystore)
            
            if [ -n "$PERSONAL_ACCESS_TOKEN" ]; then
              echo "Saving new keys to GitHub repository secrets..."
              echo "$PERSONAL_ACCESS_TOKEN" | gh auth login --with-token
              gh secret set KEYSTORE_BASE64 -b "$KEYSTORE_BASE64" --repo ${{ github.repository }}
              gh secret set KEY_ALIAS -b "$KEY_ALIAS" --repo ${{ github.repository }}
              gh secret set KEY_PASSWORD -b "$KEY_PASSWORD" --repo ${{ github.repository }}
              gh secret set STORE_PASSWORD -b "$STORE_PASSWORD" --repo ${{ github.repository }}
              echo "Successfully saved signing configuration to repository secrets!"
            else
              echo "WARNING: PERSONAL_ACCESS_TOKEN secret is missing."
              echo "The CI generated a keystore, but cannot save it to secrets without a PAT."
              echo "App updates won't work on user devices unless this key is preserved."
              echo "Create a fine-grained PAT with 'secrets' read/write on this repo and add it as PERSONAL_ACCESS_TOKEN."
            fi
          else
            echo "Keystore found in secrets. Decoding..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          fi
          
          echo "Writing key.properties..."
          echo "storePassword=$STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=release.keystore" >> android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Build signed release AAB
        run: flutter build appbundle --release

      - name: Rename APK and AAB with version
        run: |
          VERSION=${{ steps.tag.outputs.value }}
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/swavoti-launcher-${VERSION}.apk
          cp build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/swavoti-launcher-${VERSION}.aab

      - name: Create GitHub Release & upload APK and AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "Go Launcher 7 ${{ steps.tag.outputs.value }}"
          prerelease: false
          make_latest: true
          body: |
            ## Go Launcher 7 ${{ steps.tag.outputs.value }}

            ### What's New & Fixed
            - Fixed a huge memory leak. App drawer icons and the Discover news page should now use significantly less RAM on low-end devices.
            - Switched the scroll physics to native Android clamping so scrolling feels a lot smoother everywhere.
            - The app drawer background now actually blurs your current wallpaper instead of just using a flat frosted overlay.
            - Folder icons on the home screen now show a proper 2x2 grid preview of the apps inside them.
            - Long-pressing the home screen now opens a new paginated card overview for all your workspaces.
            - The Discover news page swipe transition feels like part of the same page now instead of sliding over the top.
            - Rewrote the app caching database. It now uses WAL mode and integrity checks to stop the icons from corrupting or disappearing randomly.
            - Fresh installs will now auto-populate the first 3 workspaces with default apps and a nice wallpaper out of the box.

            ### Known Issues
            - We still haven't been able to properly diagnose why the widget bottom sheet feels sluggish. We're looking into it.

            ### Install
            Download `swavoti-launcher-${{ steps.tag.outputs.value }}.apk` below and install on your Android device.

            ### Google Play Store
            Upload `swavoti-launcher-${{ steps.tag.outputs.value }}.aab` below to the Google Play Console.

            > **Note**: You may need to enable *Install from unknown sources* in your device settings. 
            > **Warning**: Google Play Protect occasionally flags unknown launchers. You may need to temporarily turn off Play Protect in the Play Store settings to successfully install the app.
          draft: false
          files: |
            build/app/outputs/flutter-apk/swavoti-launcher-${{ steps.tag.outputs.value }}.apk
            build/app/outputs/bundle/release/swavoti-launcher-${{ steps.tag.outputs.value }}.aab
